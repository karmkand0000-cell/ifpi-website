<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Course Enquiry · IFPI</title>
  <meta name="description" content="Enquire about NISM certification and stock market courses at IFPI.">
  <meta name="theme-color" content="#12304F">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="enquiry">
    <div class="enquiry-head"><span class="logo-mark">IF</span><div><strong id="eName">IFPI</strong><span id="eTag"></span></div></div>
    <div class="enquiry-card" id="card">
      <div><h1>Get course details</h1><p class="muted" style="margin:6px 0 0">Leave your number and a counsellor will WhatsApp you the fees, syllabus and next batch dates.</p></div>
      <form id="ef" class="form-grid" novalidate>
        <label class="field full"><span>Full name</span><input name="full_name" required autocomplete="name"></label>
        <label class="field"><span>Mobile (WhatsApp)</span><input name="phone" inputmode="tel" required autocomplete="tel" placeholder="98765 43210"></label>
        <label class="field"><span>City</span><input name="city" autocomplete="address-level2"></label>
        <label class="field full"><span>Email (optional)</span><input name="email" type="email" autocomplete="email"></label>
        <label class="field full"><span>Course you're interested in</span><select name="course_id" id="eCourse"><option value="">Not sure yet, please guide me</option></select></label>
        <label class="field full"><span>Anything you'd like to ask?</span><textarea name="notes" rows="3" placeholder="Preferred timing, experience level, exam date…"></textarea></label>
        <label class="check full"><input type="checkbox" name="consent" required> I agree to be contacted on WhatsApp and phone about IFPI courses.</label>
        <p class="error-text full" id="eErr" hidden></p>
        <button class="btn primary block full" type="submit">Send enquiry</button>
      </form>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="js/enquiry.js"></script>
</body>
</html>
